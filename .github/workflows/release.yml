name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen + create-dmg
        run: brew install xcodegen create-dmg

      - name: Package unsigned .app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/package.sh "$VERSION"

      - name: Sign appcast (EdDSA)
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # Locate Sparkle's generate_appcast from the resolved SwiftPM artifacts.
          # `|| true`: find exits non-zero if a path arg (DerivedData) is absent on a fresh runner,
          # which under `set -e` would abort before the guard below. The guard handles the empty case.
          GEN=$(find ~/Library/Developer/Xcode/DerivedData build -name generate_appcast -type f -print -quit 2>/dev/null || true)
          [ -n "$GEN" ] || { echo "generate_appcast not found — Sparkle must be resolved first"; exit 1; }
          # Write the private key to a tightly-permissioned temp file rather than piping it
          # via stdin (`--ed-key-file -`): stdin support is version-dependent, while the
          # keyfile flag is broadly supported and just as safe when the file is removed
          # immediately after use. NOTE: re-confirm generate_appcast's exact key-input flag
          # (--ed-key-file vs. an alternate name) against the Sparkle version actually
          # resolved here (check via context7) before the first real release — Sparkle
          # deprecated the old `-s` inline-key flag and CLI details can shift across
          # versions. Never echo/print the key.
          KEYFILE="$(mktemp)"
          chmod 600 "$KEYFILE"
          trap 'rm -f "$KEYFILE"' EXIT
          tr -d '\n' <<< "$SPARKLE_ED_PRIVATE_KEY" > "$KEYFILE"
          # Run generate_appcast against a dir holding ONLY the zip. dist/ also has the
          # .dmg, and generate_appcast would otherwise emit a second (DMG) enclosure for
          # the same version. Sparkle updates use the zip; the DMG is a human download.
          mkdir -p appcast-src public
          cp dist/ClaudeStatusBar-*.zip appcast-src/
          # Host the update ZIP on GitHub Pages (public), NOT the Release assets — those
          # returned 404 to Sparkle's unauthenticated download while the repo was private.
          "$GEN" --ed-key-file "$KEYFILE" \
            --download-url-prefix "https://ivan-mihalic.github.io/claude-status-bar/" \
            appcast-src/
          rm -f "$KEYFILE"
          cp appcast-src/appcast.xml public/appcast.xml
          cp dist/ClaudeStatusBar-*.zip public/

      - name: Create GitHub Release + upload dmg & zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/ClaudeStatusBar-*.dmg dist/ClaudeStatusBar-*.zip --title "${GITHUB_REF_NAME}" --generate-notes

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with: { path: public }

  deploy-pages:
    needs: release
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
