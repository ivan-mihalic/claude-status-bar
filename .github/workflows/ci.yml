name: CI

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  test:
    # macos-15 ships Xcode 16 / Swift 6 by default, which swift-testing
    # (`import Testing`, used throughout this package's test target) requires.
    # A Swift 5.x toolchain fails to compile the test target entirely, so we
    # pin the runner image rather than best-effort-selecting an Xcode version.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift toolchain version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        # RUN_KEYCHAIN_TESTS is intentionally left unset: the keychain
        # round-trip test requires an interactive/unlocked keychain and
        # must stay skipped in CI.
        run: swift test

  app-build:
    # Builds the macOS .app target (XcodeGen + xcodebuild) unsigned, so a
    # broken app target fails CI even though it isn't exercised by the SPM
    # test suite above.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          xcodebuild -project ClaudeStatusBar.xcodeproj -scheme ClaudeStatusBar \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build
