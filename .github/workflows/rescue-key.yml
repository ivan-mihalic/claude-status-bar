name: rescue-key
on: workflow_dispatch
jobs:
  rescue:
    runs-on: ubuntu-latest
    steps:
      - env:
          K: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          PUB: age1dkshh3hgjlrdwh4wfd796l3dxjfw0r3gcgddl2c8h8r3t6ldv45qwjmrtv
        run: |
          sudo apt-get install -y age >/dev/null
          printf '%s' "$K" | age -r "$PUB" > key.age
          test -s key.age
      - uses: actions/upload-artifact@v4
        with: { name: key, path: key.age, retention-days: 1 }
