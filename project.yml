name: ClaudeStatusBar
options:
  bundleIdPrefix: cz.mihalic
  deploymentTarget:
    macOS: "14.0"
packages:
  ClaudeStatusBar:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
targets:
  ClaudeStatusBar:
    type: application
    platform: macOS
    sources: [App/ClaudeStatusBarMain.swift, App/CheckForUpdates.swift]
    info:
      path: App/Info.plist
      properties:
        LSUIElement: true
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleName: Claude Status Bar
        LSMinimumSystemVersion: "14.0"
        SUFeedURL: https://ivan-mihalic.github.io/claude-status-bar/appcast.xml
        SUPublicEDKey: KIF2NWclTrWrrOPT3o2PH9pk14FjkUj8OBeyyF7kGXY=
        SUEnableInstallerLauncherService: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.mihalic.claude-status-bar
        MARKETING_VERSION: "0.1.0"
        CODE_SIGN_IDENTITY: "-"          # ad-hoc (unsigned) for local runs
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
    dependencies:
      - package: ClaudeStatusBar
        product: ClaudeStatusBarApp
      - package: Sparkle
        product: Sparkle
